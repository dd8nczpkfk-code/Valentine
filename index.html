<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #ff4d6d;
            --bg: #0a0a0a;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg);
            font-family: 'Inter', sans-serif;
            color: white;
            overflow: hidden;
            text-align: center;
        }

        /* Ambient Glow Background */
        .glow {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 77, 109, 0.15) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
            filter: blur(40px);
        }

        .container { z-index: 1; }

        .i-love-text {
            font-size: 1.2rem;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-bottom: 10px;
            opacity: 0.8;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 2rem;
            font-weight: 700;
            background: linear-gradient(to bottom, #ffffff, #a1a1a1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 25px;
            position: relative;
            height: 60px; /* Space for buttons */
        }

        button {
            padding: 15px 45px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: none;
        }

        #yesBtn {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 10px 20px rgba(255, 77, 109, 0.3);
        }

        #noBtn {
            background-color: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        #successMessage {
            display: none;
            animation: scaleUp 0.6s forwards;
        }

        @keyframes scaleUp {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .heart-icon { font-size: 5rem; margin-bottom: 1rem; display: block; }
    </style>
</head>
<body>

    <div class="glow"></div>

    <div class="container" id="mainCard">
        <div class="i-love-text">I Love You</div>
        <h1>Will you be my Valentain?</h1>
        <div class="buttons">
            <button id="yesBtn" onclick="celebrate()">Yes</button>
            <button id="noBtn" onmouseover="teleportNo()">No</button>
        </div>
    </div>

    <div id="successMessage">
        <span class="heart-icon">💖</span>
        <h1 style="background: linear-gradient(to right, #ff4d6d, #ff8fa3); -webkit-background-clip: text;">
            YAY!! Best decision ever
        </h1>
        <p style="color: #888;">I love you more than words can say!</p>
    </div>

            // Move it randomly within the window
            const x = Math.random() * (window.innerWidth - btn.offsetWidth);
            const y = Math.random() * (window.innerHeight - btn.offsetHeight);
            
            btn.style.position = 'fixed';
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }
