<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Special Question</title>
    <style>
        :root {
            --primary: #ff4d6d;
            --bg: #0a0a0a;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: white;
            overflow: hidden;
            text-align: center;
        }

        /* Subtle Glow Background */
        .glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(255, 77, 109, 0.2) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
        }

        .container {
            z-index: 1;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 2rem;
            background: linear-gradient(to bottom, #ffffff, #888888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            position: relative;
        }

        button {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
        }

        #yesBtn {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 0 20px rgba(255, 77, 109, 0.4);
        }

        #yesBtn:hover {
            transform: scale(1.1);
            background-color: #ff758f;
        }

        #noBtn {
            background-color: transparent;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            position: absolute; /* Needed for movement */
            left: 140px; /* Initial offset from center */
        }

        #successMessage {
            display: none;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .emoji {
            font-size: 4rem;
            display: block;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

    <div class="glow"></div>

    <div class="container" id="mainCard">
        <span class="emoji">❤️</span>
        <h1>Will you be my Valentain?</h1>
        <div class="buttons">
            <button id="yesBtn" onclick="showSuccess()">Yes</button>
            <button id="noBtn">No</button>
        </div>
    </div>

    <div id="successMessage">
        <span class="emoji">✨🥰✨</span>
        <h1 style="background: linear-gradient(to bottom, #ff9a9e, #fecfef); -webkit-background-clip: text;">
            YAY!! Best decision ever
        </h1>
    </div>

    <script>
        const noBtn = document.getElementById('noBtn');
        const mainCard = document.getElementById('mainCard');
        const successMessage = document.getElementById('successMessage');

        // Function to move the "No" button
        const moveButton = () => {
            // Get screen dimensions minus button size
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        };

        // Trigger move on hover/cursor proximity
        noBtn.addEventListener('mouseover', moveButton);
        noBtn.addEventListener('touchstart', moveButton); // For mobile

        function showSuccess() {
            mainCard.style.display = 'none';
            successMessage.style.display = 'block';
            
            // Optional: Launch some confetti or effects here
            document.body.style.background = "#1a0505"; 
        }
    </script>
</body>
</html>
