<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine Surprise 💖</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
        }

        .container {
            text-align: center;
            z-index: 2;
            width: 90%;
            max-width: 500px;
        }

        h1 {
            font-size: 2.5rem;
            color: white;
            margin-bottom: 40px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .btn-group {
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .btn {
            padding: 15px 40px;
            font-size: 1.4rem;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.3s ease;
            font-weight: bold;
        }

        #yesBtn {
            background: #ff004f;
            color: white;
            box-shadow: 0 8px 20px rgba(255,0,79,0.4);
        }

        #yesBtn:hover {
            transform: scale(1.15);
        }

        #noBtn {
            background: #fff;
            color: #333;
            position: absolute;
            transition: 0.1s;
        }

        /* Result Styling to match your screenshot */
        .meme-content {
            background: rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            animation: pop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .meme-content h2 {
            font-size: 3.5rem;
            margin: 0;
            color: #1a1a1a;
            font-weight: 800;
        }

        .meme-content p {
            font-size: 1.5rem;
            color: #1a1a1a;
            margin: 10px 0;
        }

        .meme-image {
            width: 100%;
            max-width: 350px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin: 15px 0;
        }

        @keyframes pop {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .heart {
            position: absolute;
            color: rgba(255,255,255,0.8);
            user-select: none;
            pointer-events: none;
            animation: floatUp 6s linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.3); opacity: 0; }
        }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <h1 id="question">Nityaa, Will you be my Valentine? 💕</h1>
    
    <div class="btn-group" id="buttons">
        <button id="yesBtn" class="btn">Yes</button>
        <button id="noBtn" class="btn">No</button>
    </div>

    <div id="result"></div>
</div>

<audio id="music" loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<script>
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const result = document.getElementById("result");
    const question = document.getElementById("question");
    const buttons = document.getElementById("buttons");
    const music = document.getElementById("music");

    // "No" button logic
    noBtn.addEventListener("mouseover", () => {
        const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
        const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";
    });

    // "Yes" button logic
    yesBtn.addEventListener("click", () => {
        // Try to play music (Note: Browser may block auto-play without user interaction)
        music.play().catch(e => console.log("Audio play blocked until interaction"));
        
        // Hide initial UI
        question.style.display = "none";
        buttons.style.display = "none";

        // Display the Office Meme Interface
        result.innerHTML = `
            <div class="meme-content">
                <h2>💖 YAY!!! 💖</h2>
                <p>Best decision ever 😘</p>
                <img src="https://media.giphy.com/media/l0amJz7K0S80FmU6S/giphy.gif" class="meme-image" alt="Oscar Dancing">
                <p>I love you ❤️</p>
            </div>
        `;

        createHearts();
    });

    function createHearts() {
        setInterval(() => {
            const heart = document.createElement("div");
            heart.className = "heart";
            const heartIcons = ["💖", "💗", "💘", "💝", "❤️"];
            heart.innerHTML = heartIcons[Math.floor(Math.random() * heartIcons.length)];
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.fontSize = Math.random() * 20 + 20 + "px";
            heart.style.duration = Math.random() * 3 + 3 + "s";
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 6000);
        }, 300);
    }
</script>

</body>
</html>
